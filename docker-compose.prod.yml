services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: fazenda
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/fazenda?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost
      JWT_SECRET: prod_super_secret_change_me
      JWT_REFRESH_SECRET: prod_super_refresh_secret_change_me
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
