services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: fazenda
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    working_dir: /app
    command: sh -c "npm install && npm run prisma:generate && npm run dev"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/fazenda?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: dev_super_secret
      JWT_REFRESH_SECRET: dev_super_refresh_secret
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  db_data:


